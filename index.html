<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verdulería Online</title>
    <!-- Link del Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🌱 Verdulería Orgánica</a>
            <button class="btn btn-outline-light position-relative" id="btn-carrito" data-bs-toggle="modal" data-bs-target="#modalCarrito">
                🛒 Carrito
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="contador-carrito">
                    0
                </span>
            </button>
        </div>
    </nav>
    <main class="container my-5"> 
        <div class="container my-3 d-flex gap-3 flex-wrap">
    <!-- Buscador existente -->
    <input type="text" id="buscador" class="form-control flex-grow-1" placeholder="🔍 Buscar verdura o fruta...">
    
    <!-- 🔽 Nuevo selector de orden por precio -->
    <select id="ordenPrecio" class="form-select" style="width: 220px;">
        <option value="default">Ordenar por precio</option>
        <option value="asc">Menor a Mayor</option>
        <option value="desc">Mayor a Menor</option>
    </select>
</div>
    <h1 class="text-center mb-4 text-success fw-bold">Nuestras Verduras Del Día</h1>
    <div class="row row-cols-1 row-cols-md-3 g-4" id="contenedor-productos"></div>
</main>
<section class="container my-5">
    <h3 class="text-center mb-4 text-danger fw-bold">¡Solo por Hoy!</h3>
    <div class="row justify-content-center">
        <div class="col-md-4 mb-4">
            <div class="card h-100 shadow-sm border-danger">
                <img src="assets/json/imgs/fruta dragon.png" class="card-img-top" alt="Fruta Dragón" style="height: 200px; object-fit: cover;">
                <div class="card-body d-flex flex-column justify-content-between">
                    <div>
                        <span class="badge bg-danger mb-2">fruta</span>
                        <h5 class="card-title fw-bold">Fruta Dragón</h5>
                        <p class="card-text text-success fs-5 fw-bold">$110</p>
                        <p class="text-muted small">Stock disponible: 25</p>
                    </div>
                    <button class="btn btn-outline-danger mt-3">
                        Agregar al Carrito
                    </button>
                </div>
            </div>
        </div>
    </div>
</section>

    <div class="modal fade" id="modalCarrito" tabindex="-1" aria-labelledby="modalCarritoLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="modalCarritoLabel">🛒 Tu Carrito de Compras</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="contenido-carrito">
                    </div>
                    <div class="d-flex justify-content-between align-items-center mt-3 border-top pt-3">
                        <h4>Total: $<span id="precio-total">0</span></h4>
                        <button class="btn btn-secondary btn-sm" id="btn-vaciar">Vaciar Carrito</button>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Seguir Comprando</button>
                    <button type="button" class="btn btn-success" id="btn-comprar">Confirmar Compra</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    
    <script defer src="js/carrito.js"></script>
    <script defer src="js/main.js"></script>

    <script defer src="js/carrito.js"></script>
    <script defer src="js/main.js"></script>

    <script>
        window.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                const inputBuscador = document.querySelector("#buscador");
                
                if (inputBuscador && typeof listaVerduras !== "undefined") {
                    inputBuscador.addEventListener("input", (e) => {
                        const textoBusqueda = e.target.value.toLowerCase().trim();
                        
                        
                        const productosFiltrados = listaVerduras.filter(producto => 
                            producto.nombre.toLowerCase().includes(textoBusqueda)
                        );

                       
                        if (typeof renderizarProductos === "function") {
                            renderizarProductos(productosFiltrados);
                        }
                    });
                }
            }, 500);
        });
    </script>
    <script>
    window.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
            const selectOrden = document.querySelector("#ordenPrecio");
            
            if (selectOrden && typeof listaVerduras !== "undefined" && typeof renderizarProductos === "function") {
                selectOrden.addEventListener("change", (e) => {
                    const criterio = e.target.value;
                    // Hacemos una copia del array para ordenar sin alterar el orden original
                    let listaOrdenada = [...listaVerduras];

                    if (criterio === "asc") {
                        listaOrdenada.sort((a, b) => a.precio - b.precio);
                    } else if (criterio === "desc") {
                        listaOrdenada.sort((a, b) => b.precio - a.precio);
                    }

                    renderizarProductos(listaOrdenada);
                });
            }
        }, 500);
    });
</script>
</body>
</html>
